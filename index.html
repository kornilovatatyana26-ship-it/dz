<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хорошего дня</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="poster" aria-label="Хорошего дня">
    <section class="poster-frame">
      <img class="poster-image" src="assets/cat-day-mockup.jpeg" alt="Котик с цветком и надписью Хорошего дня">

      <button
        class="prediction-button"
        type="button"
        id="predictionButton"
        aria-label="получить ежедневное предсказание"
      ></button>

      <p class="prediction" id="predictionText" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
