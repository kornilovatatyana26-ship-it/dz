<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хорошего дня</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="greeting">
    <section class="greeting-content" aria-label="Хорошего дня">
      <h1>Хорошего дня</h1>
      <button class="prediction-button" type="button" id="predictionButton">
        Забрать предсказание
      </button>
      <p class="prediction" id="predictionText" aria-live="polite"></p>
    </section>

    <figure class="cat-frame">
      <img class="greeting-image" src="assets/cat-hero.png" alt="Улыбающийся котик с жёлтым цветком">
    </figure>
  </main>
</body>
</html>
